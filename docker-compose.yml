name: prometheus-stack

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-10y}
      - --query.lookback-delta=${PROMETHEUS_LOOKBACK_DELTA:-5m}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy

  # Transaction storage. The image has no shell or HTTP client, so there is no
  # healthcheck: readiness is http://localhost:3100/ready.
  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-10y}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  # Transaction ingestion: watches the import folder and ships every .jsonl
  # line to Loki. No healthcheck (no HTTP client in the image): readiness is
  # http://localhost:12345/-/ready.
  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${IMPORT_TRANSACTIONS_DIR:-./import-transactions}:/import:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      loki:
        condition: service_started

  # On-demand backfill job: `docker compose run --rm importer`.
  # The profile keeps it out of `docker compose up`.
  importer:
    image: prom/prometheus:v3.16.0
    profiles: [import]
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/import.sh"]
    volumes:
      - prometheus-data:/prometheus
      - ${IMPORT_DIR:-./import}:/import
      - ./scripts:/scripts:ro

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
