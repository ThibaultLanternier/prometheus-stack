# Single-binary Loki for local transaction storage.
# Loaded with -config.expand-env=true, so ${VAR:-default} is expanded.
#
# Several defaults are changed so that historical data can be imported:
# Loki normally rejects entries older than a week, limits queries to 30 days
# and keeps data forever only if retention is disabled.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    # Starts at the epoch so that every historical date falls in a period.
    - from: "1970-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Out-of-order entries are accepted within max_chunk_age / 2 of the newest
  # entry of a stream. A very large value lets older history be imported after
  # newer data. Chunks still flush when idle or full.
  max_chunk_age: 87600h

limits_config:
  reject_old_samples: false
  # Entries more than this far in the future are discarded
  # (reason "too_far_in_future").
  creation_grace_period: 25h
  retention_period: ${LOKI_RETENTION:-10y}
  max_query_length: 0
  max_query_lookback: 0
  # Loki splits each query into 1h sub-queries by default: a multi-year query
  # becomes tens of thousands of them and times out. With a few thousand
  # transactions, a single query is fast.
  split_queries_by_interval: 0
  max_entries_limit_per_query: 50000
  allow_structured_metadata: true
  volume_enabled: true
  # Keep exactly the labels the sender sets (job, account, type): Loki
  # otherwise adds a service_name label and a detected_level field.
  discover_service_name: []
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
