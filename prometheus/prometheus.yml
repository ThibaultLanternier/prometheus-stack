# Prometheus scrapes itself and the other stack components. User data
# arrives through the importer (promtool backfill), not through scraping.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Loki: counts entries it discards (e.g. reason="too_far_in_future").
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Alloy: counts transaction lines dropped by the ingestion pipeline.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
